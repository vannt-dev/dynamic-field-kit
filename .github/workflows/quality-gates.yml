name: Quality Gates

# The single definition of "is this commit good?". Called by both ci.yml and
# release.yml, so a publish can never run against checks weaker than a PR's.
on:
  workflow_call:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint & Format
        run: npm run lint && npm run format-check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build packages
        run: |
          npm run build --workspace=@dynamic-field-kit/core
          npm run build --workspace=@dynamic-field-kit/react
          npm run build --workspace=@dynamic-field-kit/vue
          npm run build --workspace=@dynamic-field-kit/angular

      # Share the built dist with the verify and examples jobs so they don't
      # rebuild all four packages (ng-packagr's Angular build especially).
      # Common ancestor of the four paths is `packages`, so the artifact stores
      # `<pkg>/dist/...`.
      - name: Upload built dist
        uses: actions/upload-artifact@v7
        with:
          name: package-dist
          path: |
            packages/core/dist
            packages/react/dist
            packages/vue/dist
            packages/angular/dist
          retention-days: 1
          if-no-files-found: error

      - name: Typecheck
        run: npm run typecheck

      - name: Type tests
        run: npm run test:types --workspace=@dynamic-field-kit/core

      # Runs after the build so the suite's "every package reports a size"
      # assertion has a dist to look at.
      - name: Test build scripts
        run: npm run test:scripts

      - name: Show bundle sizes
        run: node scripts/show-sizes.js

  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: core
            test-cmd: npm run test --workspace=@dynamic-field-kit/core -- --coverage
            coverage-file: packages/core/coverage/lcov.info
            coverage-name: core
          - package: react
            build-cmd: npm run build --workspace=@dynamic-field-kit/core
            test-cmd: npm run test --workspace=@dynamic-field-kit/react -- --coverage
            coverage-file: packages/react/coverage/lcov.info
            coverage-name: react
          - package: vue
            build-cmd: npm run build --workspace=@dynamic-field-kit/core
            test-cmd: npm run test --workspace=@dynamic-field-kit/vue -- --coverage
            coverage-file: packages/vue/coverage/lcov.info
            coverage-name: vue
          - package: angular
            build-cmd: npm run build --workspace=@dynamic-field-kit/core
            test-cmd: npm run test --workspace=@dynamic-field-kit/angular -- --coverage
            coverage-file: packages/angular/coverage/lcov.info
            coverage-name: angular
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build core
        if: matrix.build-cmd != ''
        run: ${{ matrix.build-cmd }}

      - name: Run tests
        run: ${{ matrix.test-cmd }}

      - name: Upload coverage
        if: matrix.coverage-file != '' && success()
        uses: codecov/codecov-action@v7
        with:
          files: ${{ matrix.coverage-file }}
          flags: unittests
          name: ${{ matrix.coverage-name }}
          fail_ci_if_error: false

  examples:
    name: Example ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    strategy:
      fail-fast: false
      matrix:
        app: [react-app, vue-app, angular-app]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # The example apps depend on the packages via `file:` paths, so the dist
      # has to exist before their install resolves them.
      - name: Download built dist
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: packages

      # Those `file:` paths resolve to the real packages/ directories, so module
      # resolution from packages/react/dist walks up to the workspace root - and
      # without a root install it never finds @dynamic-field-kit/core.
      - name: Install workspace dependencies
        run: npm ci

      # `npm install`, not `npm ci`: example/angular-app gitignores its
      # package-lock.json, so there is no lockfile to clean-install from. The
      # other two still honour their committed lockfiles.
      - name: Install example dependencies
        working-directory: example/${{ matrix.app }}
        run: npm install --no-audit --no-fund

      # Each example's build typechecks its sources against the built packages,
      # which is what catches a README/demo drifting from the real API.
      - name: Build example
        working-directory: example/${{ matrix.app }}
        run: npm run build

  verify:
    runs-on: ubuntu-latest
    needs: [lint-and-build, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Reuse the dist built by lint-and-build instead of rebuilding all four
      # packages. Extract into `packages/` so paths become packages/<pkg>/dist.
      - name: Download built dist
        uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: packages

      - name: Smoke test built packages
        run: npm run test --workspace=@dynamic-field-kit/smoke

      - name: Run verification scripts
        run: |
          node scripts/verify-framework-deps.js
          node scripts/check-cross-framework-imports.js
          node scripts/integration-cross-registry.js
