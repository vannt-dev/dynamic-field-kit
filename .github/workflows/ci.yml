name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/quality-gates.yml

  # The React Storybook lives outside the workspaces with its own lockfile, so
  # its install never touches the packages' dependency tree. Its stories read
  # the packages from source: a story broken by an API change fails here.
  storybook:
    name: Storybook
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: storybook
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: storybook/package-lock.json

      - name: Install Storybook dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck the stories
        run: npm run typecheck

      - name: Render every story
        run: npm test

      - name: Build Storybook
        run: npm run build-storybook

  changeset:
    name: Changeset present
    runs-on: ubuntu-26.04
    # Only PRs into develop can be missing a changeset, because develop is where
    # unreleased work accumulates. Skipped elsewhere:
    #
    # - the release PR changesets itself opens, which consumes the changesets
    #   and bumps versions, so it changes packages while legitimately having
    #   none left;
    # - any PR into master, which carries changes that were already released
    #   from develop - their changesets are gone by definition, and demanding a
    #   new one would mean releasing the same work twice;
    # - Dependabot's PRs, which change development dependencies almost always.
    #   Each one failed here until an empty changeset was pushed to it by hand.
    #   A dependency update that does need a release gets its changeset with
    #   the release.
    if: >-
      github.event_name == 'pull_request' &&
      github.base_ref == 'develop' &&
      !startsWith(github.head_ref, 'changeset-release/') &&
      !startsWith(github.head_ref, 'dependabot/')
    steps:
      - uses: actions/checkout@v7
        with:
          # changeset status diffs against the base branch, so it needs history.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fails when a PR changes a publishable package without adding a
      # changeset, which would otherwise merge and silently never be released.
      # Add one with `npx changeset`.
      - name: Check for a changeset
        run: npx changeset status --since=origin/${{ github.base_ref }}
