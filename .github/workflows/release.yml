name: Release

# Manual only. Pick a bump, pick the packages, press Run - the workflow does
# the version bump, the CHANGELOG, the commit and the npm publish. Nothing is
# versioned by hand.
#
# Run it on `develop`. master requires status checks, and those apply to direct
# pushes too, so the release commit cannot be pushed there by the Actions bot.
# The version bump reaches master through the normal develop -> master PR.
#
# If the publish step fails part way (a token without access to one package,
# for example), do not run it again as it is: that bumps every package a second
# time. Fix the cause and run it with `resume` ticked. It skips the version
# bump, publishes the packages npm does not have yet, then tags and releases.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to apply'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true
      packages:
        description: 'Packages to bump, comma separated (core,react,vue,angular,svelte). Leave empty for all.'
        type: string
        default: ''
        required: false
      message:
        description: 'CHANGELOG entry for this release'
        type: string
        default: ''
        required: false
      dry_run:
        description: 'Version and print what would be published, but do not publish'
        type: boolean
        default: false
        required: false
      resume:
        description: 'Finish a release whose publish failed: no version bump, publish what npm does not have yet, then tag and release'
        type: boolean
        default: false
        required: false

# Deliberately no cancel-in-progress: cancelling mid-publish could leave some
# packages on npm and others not.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  # npm provenance: the publish signs each tarball with a short-lived OIDC
  # token, which links the package on npm back to this exact run. Every
  # package sets `publishConfig.provenance`, and npm fails the publish
  # outright if it cannot mint the token.
  id-token: write

jobs:
  # The exact gates a PR faces, so a release can never ship something CI would
  # have rejected.
  gates:
    uses: ./.github/workflows/quality-gates.yml

  release:
    name: Release & Publish
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Turns the dispatch inputs into a real changeset. Any changesets already
      # committed are consumed in the same pass, and the largest bump per
      # package wins.
      # With `resume` the four versioning steps are skipped: the version commit
      # of the failed release is already on the branch, and bumping again would
      # put every package one version further than the one being finished.
      - name: Create changeset from inputs
        if: ${{ !inputs.resume }}
        run: |
          node scripts/create-changeset.js \
            --bump "${{ inputs.bump }}" \
            --packages "${{ inputs.packages }}" \
            --message "${{ inputs.message }}"

      - name: Apply versions and changelogs
        if: ${{ !inputs.resume }}
        run: npx changeset version

      # changeset version rewrites the workspace package.json versions, which
      # the lockfile records too - without this the next `npm ci` fails.
      - name: Sync lockfile
        if: ${{ !inputs.resume }}
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Show resulting versions
        run: |
          for pkg in core react vue angular svelte; do
            echo "$pkg -> $(node -p "require('./packages/$pkg/package.json').version")"
          done

      - name: Build packages
        run: npm run build

      # Its own step, not part of the commit: the annotated tag needs an identity
      # too, and a resumed release makes the tag without making the commit.
      - name: Set the git identity
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Commit the release
        if: ${{ !inputs.dry_run && !inputs.resume }}
        run: |
          git add -A
          git commit -m 'chore(release): version packages'
          git push origin HEAD:${{ github.ref_name }}

      # changeset publish pushes each package that is not already on npm at its
      # current version. Its own tagging is off: it writes one tag per package,
      # and with all four on a single version line that is the same release
      # stated four times. One annotated tag carries it instead, named after
      # core - the anchor of the version line - with the exact version of each
      # package in its body, which is what disambiguates the case where the
      # `linked` group lets one package move on its own.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          npx changeset publish --no-git-tag

          version=$(node -p "require('./packages/core/package.json').version")
          published=$(for pkg in core react vue angular svelte; do
            echo "@dynamic-field-kit/$pkg@$(node -p "require('./packages/$pkg/package.json').version")"
          done)

          # A resumed release may find the tag already made by the run it finishes.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists - leaving it alone."
          else
            git tag -a "v$version" -m "Release v$version" -m "$published"
            git push origin "v$version"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The tag alone is not what people look at. Tagging and publishing left
      # the Releases page untouched, so v1.5.0 had to be written by hand, and
      # v1.5.1 and v1.6.0 were missing from it entirely while being live on
      # npm - the tags existed, the Releases did not.
      #
      # The notes are core's own CHANGELOG section for this version, so there
      # is one source of truth and nothing to keep in sync by hand. An existing
      # release is left alone, which makes re-running this workflow safe rather
      # than a hard failure at the last step.
      - name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists - leaving it alone."
            exit 0
          fi

          {
            echo 'All five packages ship at this version with npm provenance:'
            echo
            for pkg in core react vue angular svelte; do
              echo "- \`@dynamic-field-kit/$pkg@$(node -p "require('./packages/$pkg/package.json').version")\`"
            done
            echo
            awk -v heading="## $version" \
              '$0 == heading { found = 1; next } /^## / { if (found) exit } found' \
              packages/core/CHANGELOG.md
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "v$version" \
            --title "v$version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo 'Dry run - nothing was committed, tagged or published.'
          echo 'Versions that would have shipped are listed above.'
          git --no-pager diff --stat
