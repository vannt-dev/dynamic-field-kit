name: Release

on:
  push:
    branches:
      - master

# Deliberately no cancel-in-progress: cancelling mid-publish could leave some
# packages on npm and others not.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  # Publishing used to run its own thinner set of checks (no lint, no format,
  # no coverage floors, no verify scripts) independently of CI, so a red CI did
  # not stop a release. The exact same gates a PR faces must pass first.
  gates:
    uses: ./.github/workflows/quality-gates.yml

  release:
    name: Release & Publish
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: release packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
