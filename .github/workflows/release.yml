name: Release

# Manual start, publish on merge. Pick a bump, pick the packages, press Run on
# `develop` - the workflow does the version bump and the CHANGELOGs, commits
# them to a `changeset-release/v<version>` branch and opens a PR into develop.
# Nothing is versioned by hand.
#
# Merging that PR publishes: the merge into develop runs the `publish` job,
# which pushes to npm what npm does not have yet, then tags and releases.
#
# The release commit goes through a PR because develop and master require the
# "CI result" check, and that applies to direct pushes too: the Actions bot
# cannot push the release commit to either. A PR opened by the Actions bot does
# not start CI on its own, so the workflow starts CI on the release branch
# itself. The version bump reaches master through the normal develop -> master PR.
#
# If the publish fails part way (a token without access to one package, for
# example), fix the cause and run this workflow on develop with `resume`
# ticked. It skips the version bump, publishes the packages npm does not have
# yet, then tags and releases.
on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump to apply'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true
      packages:
        description: 'Packages to bump, comma separated (core,react,vue,angular,svelte). Leave empty for all.'
        type: string
        default: ''
        required: false
      message:
        description: 'CHANGELOG entry for this release'
        type: string
        default: ''
        required: false
      dry_run:
        description: 'Version and print what would be published, but do not publish'
        type: boolean
        default: false
        required: false
      resume:
        description: 'Finish a release whose publish failed: no version bump, publish what npm does not have yet, then tag and release'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

jobs:
  # The exact gates a PR faces, so a release PR is never opened for something
  # CI would have rejected.
  gates:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.resume }}
    uses: ./.github/workflows/quality-gates.yml

  prepare:
    name: Open the release PR
    needs: [gates]
    runs-on: ubuntu-latest
    permissions:
      # The release branch.
      contents: write
      # The release PR.
      pull-requests: write
      # Starting CI on the release branch.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the job pushes the release branch with these
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Turns the dispatch inputs into a real changeset. Any changesets already
      # committed are consumed in the same pass, and the largest bump per
      # package wins.
      - name: Create changeset from inputs
        env:
          BUMP: ${{ inputs.bump }}
          PACKAGES: ${{ inputs.packages }}
          MESSAGE: ${{ inputs.message }}
        run: |
          node scripts/create-changeset.js \
            --bump "$BUMP" \
            --packages "$PACKAGES" \
            --message "$MESSAGE"

      - name: Apply versions and changelogs
        run: npx changeset version

      # changeset version rewrites the workspace package.json versions, which
      # the lockfile records too - without this the next `npm ci` fails.
      - name: Sync lockfile
        run: npm install --package-lock-only --no-audit --no-fund

      - name: Show resulting versions
        run: |
          for pkg in core react vue angular svelte; do
            echo "$pkg -> $(node -p "require('./packages/$pkg/package.json').version")"
          done

      - name: Build packages
        run: npm run build

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo 'Dry run - nothing was committed, opened or published.'
          echo 'Versions that would have shipped are listed above.'
          echo 'Packages that would get a tag and a Release of their own (tag, package, version):'
          node scripts/own-release-packages.js
          git --no-pager diff --stat

      # The branch name starts with changeset-release/: ci.yml does not ask a
      # release PR for a changeset (it consumes them), and the publish job
      # only runs for a merged PR from such a branch.
      - name: Open the release PR
        if: ${{ !inputs.dry_run }}
        env:
          BASE: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./packages/core/package.json').version")
          branch="changeset-release/v$version"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add -A
          git commit -m "chore(release): v$version"
          git push origin "$branch"

          {
            echo "Versions and CHANGELOGs for v$version, made by the Release workflow."
            echo
            for pkg in core react vue angular svelte; do
              echo "- `@dynamic-field-kit/$pkg@$(node -p "require('./packages/$pkg/package.json').version")`"
            done
            echo
            echo 'Merging this PR publishes these versions to npm, then tags and releases them.'
            echo 'If the CI result check does not start, close and reopen this PR.'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$BASE" --head "$branch" \
            --title "chore(release): v$version" --body-file "$RUNNER_TEMP/pr-body.md"

          # A push or a PR made with the workflow token starts no workflow, so CI
          # would never report on the release PR. A dispatch is the exception.
          gh workflow run ci.yml --ref "$branch"

  publish:
    name: Publish
    # A merged release PR from this repository, or a resumed release.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged &&
       startsWith(github.event.pull_request.head.ref, 'changeset-release/') &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.resume && !inputs.dry_run)
    runs-on: ubuntu-latest
    # Deliberately no cancel-in-progress: cancelling mid-publish could leave some
    # packages on npm and others not.
    concurrency: release-publish
    permissions:
      # The tags and the GitHub Release.
      contents: write
      # npm provenance: the publish signs each tarball with a short-lived OIDC
      # token, which links the package on npm back to this exact run. Every
      # package sets `publishConfig.provenance`, and npm fails the publish
      # outright if it cannot mint the token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] the job pushes the release tags with these
          # The merge commit of the release PR, or develop for a resumed release.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Show versions to publish
        run: |
          for pkg in core react vue angular svelte; do
            echo "$pkg -> $(node -p "require('./packages/$pkg/package.json').version")"
          done

      - name: Build packages
        run: npm run build

      - name: Set the git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # changeset publish pushes each package that is not already on npm at its
      # current version. Its own tagging is off: it writes one tag per package,
      # and with all four on a single version line that is the same release
      # stated four times. One annotated tag carries it instead, named after
      # core - the anchor of the version line - with the exact version of each
      # package in its body, which is what disambiguates the case where the
      # `linked` group lets one package move on its own.
      - name: Publish to npm
        run: |
          npx changeset publish --no-git-tag

          version=$(node -p "require('./packages/core/package.json').version")
          published=$(for pkg in core react vue angular svelte; do
            echo "@dynamic-field-kit/$pkg@$(node -p "require('./packages/$pkg/package.json').version")"
          done)

          # A resumed release may find the tag already made by the run it finishes.
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Tag v$version already exists - leaving it alone."
          else
            git tag -a "v$version" -m "Release v$version" -m "$published"
            git push origin "v$version"
          fi

          # A package that moved on its own (angular 1.11.1 next to core 1.11.0) has no
          # v<version> tag to stand for it: it gets one named after itself.
          own=$(node scripts/own-release-packages.js)
          while read -r tag _ _; do
            [ -n "$tag" ] || continue
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists - leaving it alone."
            else
              git tag -a "$tag" -m "Release $tag"
              git push origin "$tag"
            fi
          done <<< "$own"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The tag alone is not what people look at. Tagging and publishing left
      # the Releases page untouched, so v1.5.0 had to be written by hand, and
      # v1.5.1 and v1.6.0 were missing from it entirely while being live on
      # npm - the tags existed, the Releases did not.
      #
      # The notes are core's own CHANGELOG section for this version, so there
      # is one source of truth and nothing to keep in sync by hand. An existing
      # release is left alone, which makes re-running this workflow safe rather
      # than a hard failure at the last step.
      - name: Create the GitHub Release
        run: |
          version=$(node -p "require('./packages/core/package.json').version")

          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists - leaving it alone."
          else
            {
              echo 'All five packages ship at this version with npm provenance:'
              echo
              for pkg in core react vue angular svelte; do
                echo "- \`@dynamic-field-kit/$pkg@$(node -p "require('./packages/$pkg/package.json').version")\`"
              done
              echo
              awk -v heading="## $version" \
                '$0 == heading { found = 1; next } /^## / { if (found) exit } found' \
                packages/core/CHANGELOG.md
            } > "$RUNNER_TEMP/release-notes.md"

            gh release create "v$version" \
              --title "v$version" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --verify-tag \
              --latest
          fi

          # A package that moved on its own gets a Release of its own, from its own
          # CHANGELOG. It is not marked latest: v<version> stays the release people land on.
          own=$(node scripts/own-release-packages.js)
          while read -r tag pkg pv; do
            [ -n "$tag" ] || continue
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists - leaving it alone."
              continue
            fi
            awk -v heading="## $pv" \
              '$0 == heading { found = 1; next } /^## / { if (found) exit } found' \
              "packages/$pkg/CHANGELOG.md" > "$RUNNER_TEMP/release-notes-$pkg.md"
            gh release create "$tag" \
              --title "$tag" \
              --notes-file "$RUNNER_TEMP/release-notes-$pkg.md" \
              --verify-tag \
              --latest=false
          done <<< "$own"
        env:
          GH_TOKEN: ${{ github.token }}
