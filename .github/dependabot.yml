version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Angular's packages only work at one version together, so they arrive as one pull request.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@analogjs/*'
          - 'ng-packagr'
      # vitest and its coverage providers only work at the same major.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
      # Everything else. The two groups above are excluded by name: without that this group
      # took their packages too (#150, #152: @angular/* and @vitest/* arrived here, with
      # @angular/compiler one patch ahead of @angular/core, and npm ci stopped with ERESOLVE).
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - '@analogjs/*'
          - 'ng-packagr'
          - 'vitest'
          - '@vitest/*'
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The Angular 22 toolchain (@angular/build, @angular-devkit/build-angular, ng-packagr,
      # compiler-cli) and typescript-eslint take typescript >=6.0 <6.1; 7 would fail npm ci with
      # ERESOLVE, as 6.0 did on Angular 21 (#110). Move this with Angular.
      - dependency-name: typescript
        versions: ['>=6.1.0']
      # The Angular package is built and tested with Angular 22 (see packages/angular/README.md).
      # Moving that toolchain to a new major is a change of its own, checked by
      # scripts/verify-angular-peer-range.js, not a dependency bump.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@analogjs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      # vitest's major has to be one @angular/build accepts as a peer: on a mismatch npm 10
      # (Node 22, this repo's CI) stops with "Cannot read properties of null (reading
      # 'edgesOut')", as it did with vitest 5 on Angular 21 (#100). @angular/build 22 takes
      # ^4 || ^5: move vitest with the Angular toolchain.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
  # The React Storybook has its own lockfile. One weekly pull request for all of it:
  # Storybook's packages only work at one version together, and the rest is build tooling.
  - package-ecosystem: npm
    directory: /storybook
    schedule:
      interval: weekly
    groups:
      storybook:
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Same hold as the root: vitest moves with the Angular toolchain there.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
      # Matches the root's TypeScript hold below 6.1.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Majors too: an action's major is usually a new runtime, and one pull request per action
      # was five at once on the first run.
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
