<main class="demo" [class.demo--wide]="showCode && hasSource">
  <nav class="demo-nav" aria-label="Demo pages">
    <button
      *ngFor="let tab of tabs"
      type="button"
      class="demo-tab"
      [attr.aria-current]="activeTab === tab.id ? 'page' : null"
      (click)="activeTab = tab.id"
    >
      {{ tab.label }}
    </button>
    <a [href]="ALL_DEMOS_URL" class="demo-tab demo-nav__home">← Tất cả demo</a>
  </nav>

  <div class="demo-head">
    <div>
      <h1>{{ current.title }}</h1>
      <p class="demo-intro">{{ current.intro }}</p>
    </div>
    <button
      *ngIf="hasSource"
      type="button"
      class="btn"
      [attr.aria-pressed]="showCode"
      style="flex-shrink: 0"
      (click)="showCode = !showCode"
    >
      {{ showCode ? 'Ẩn code' : 'Xem code' }}
    </button>
  </div>

  <div class="demo-split" [class.demo-split--code]="showCode && hasSource">
    <section class="demo-card">
      <!-- Cơ bản -->
      <ng-container *ngIf="activeTab === 'legacy'">
        <dfk-multi-field-input
          [fieldDescriptions]="legacyFields"
          [properties]="legacyData"
          [layout]="layout"
          (onChange)="onLegacyChange($event)"
        ></dfk-multi-field-input>
        <div class="demo-panel">
          <h3>Dữ liệu form</h3>
          <pre>{{ legacyData | json }}</pre>
        </div>
      </ng-container>

      <!-- Validation -->
      <ng-container *ngIf="activeTab === 'new'">
        <dfk-multi-field-input
          [fieldDescriptions]="newFields"
          [properties]="newData"
          [layout]="layout"
          [errors]="errors"
          [touched]="newTouched"
          (onBlurField)="onNewBlur($event)"
          (onChange)="onNewChange($event)"
        ></dfk-multi-field-input>
        <div class="demo-actions">
          <button
            type="button"
            class="btn btn--primary"
            [disabled]="validating"
            (click)="handleValidate()"
          >
            {{ validating ? 'Đang kiểm tra...' : 'Kiểm tra lỗi' }}
          </button>
        </div>
        <div class="demo-panel">
          <h3>Dữ liệu form</h3>
          <pre>{{ newData | json }}</pre>
        </div>
        <div *ngIf="hasErrors()" class="demo-panel demo-panel--danger">
          <h3>Lỗi kiểm tra</h3>
          <pre>{{ errors | json }}</pre>
        </div>
      </ng-container>

      <app-enterprise-demo
        *ngIf="activeTab === 'enterprise'"
      ></app-enterprise-demo>
      <app-wizard-demo *ngIf="activeTab === 'wizard'"></app-wizard-demo>
      <app-schema-demo *ngIf="activeTab === 'schema'"></app-schema-demo>
    </section>

    <aside *ngIf="showCode && hasSource" class="demo-code">
      <div class="demo-code__bar">
        <span>src/app/demos/{{ activeTab }}.component.ts</span>
      </div>
      <pre>{{ currentSource() }}</pre>
    </aside>
  </div>
</main>
